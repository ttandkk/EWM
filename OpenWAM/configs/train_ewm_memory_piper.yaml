# Full Lean patch4 future tokens; compressed physical-event memory only.
# python scripts/train.py --config-name train_ewm_memory_piper
defaults:
  - train_ewm
  - _self_

model:
  type: ewm_memory
  memory_enabled: true
  memory_dim: 128
  memory_refined_cells: 4  # 16-4 coarse + 4*4 fine = 28 K/V tokens per camera
  memory_tau_fast: 0.08
  memory_tau_slow: 0.40
  memory_max_age: 1.60

dataloader:
  type: ewm_piper_memory
  memory_history_frames: 8
  gpu_voxelization: false

training:
  pure_noise_eval:
    enabled: false

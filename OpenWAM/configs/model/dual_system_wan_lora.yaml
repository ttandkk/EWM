# Wan video adapters + full ActionDiT/proprio, aligned with FastWAM.
defaults:
  - dual_system
  - _self_

architecture:
  video_lora:
    rank: 16
    alpha: 16
    dropout: 0.0
    target_modules:
      - self_attn.q
      - self_attn.k
      - self_attn.v
      - self_attn.o
      - cross_attn.q
      - cross_attn.k
      - cross_attn.v
      - cross_attn.o
      - ffn.0
      - ffn.2

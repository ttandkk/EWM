# Same 0.3s window: RGB4 semantics + event10 pixel differences, dual view.
# python scripts/train.py --config-name train_ewm_rgb_event_memory_piper
# Set EWM_MEMORY_DINO_CACHE to a completed cache to avoid historical DINO forwards.
defaults:
  - train_ewm
  - _self_

model:
  type: ewm_rgb_event_memory
  event_camera_mode: dual
  memory_enabled: true
  memory_dim: 256
  memory_heads: 4
  memory_dino_batch_size: 16

dataloader:
  type: ewm_piper_rgb_event_memory
  event_camera_mode: dual
  gpu_voxelization: false
  memory_dino_cache_dir: ${oc.env:EWM_MEMORY_DINO_CACHE,null}
  memory_dino_path: ${model.dino_path}

training:
  init_policy_checkpoint: null
  pure_noise_eval:
    enabled: false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-policies"
version = "0.1.0"
description = "Model-owned policy services for the Piper benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "omegaconf>=2.3", "websockets>=15", "piper-bench>=0.1.0"]

[project.scripts]
piper-policy = "piper_policies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
